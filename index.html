<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- ========================
         SIDEBAR
         ======================== -->
    <aside id="sidebar">
      <!-- Populated by JS -->
    </aside>

    <!-- ========================
         MAIN AREA
         ======================== -->
    <div id="main-area">

      <!-- TOP TAB BAR -->
      <header id="top-tab">
        <div class="tab-pill" id="tab-pill">
          <!-- Workspace tabs populated by JS -->
        </div>
      </header>

      <!-- CONTENT -->
      <main id="content">
        <!-- Bookmark cards populated by JS -->
      </main>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
